[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-ai-agent"
version = "0.1.0"
description = "Privacy-conscious musical instruments customer support agent (technical challenge)"
requires-python = ">=3.11"

[project.optional-dependencies]
llm = ["groq>=0.30,<2", "python-dotenv>=1,<2"]

[tool.setuptools]
packages = ["app"]
